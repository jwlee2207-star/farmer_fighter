<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농부 파이터</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #menu-screen {
            position: relative;
            text-align: center;
            background: #2c2c2c;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            width: 320px;
        }
        h1 {
            margin-bottom: 25px;
            color: #ffcc00;
        }
        .game-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .game-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <!-- 메뉴 화면 영역 -->
    <div id="menu-screen">
        <!-- 전체화면 버튼 (우측 상단 배치) -->
        <button id="fullscreen-btn" style="position: absolute; top: 15px; right: 15px; padding: 6px 10px; font-size: 12px; cursor: pointer; background-color: #ffcc00; border: none; border-radius: 4px; font-weight: bold; color: #000;">전체화면</button>
        
        <h1>농부 파이터</h1>
        <button class="game-btn" onclick="startGame()">게임 시작</button>
    </div>

    <script>
        // 전체화면 토글 기능
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                // 전체화면 켜기
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`전체화면 전환 실패: ${err.message}`);
                });
            } else {
                // 전체화면 끄기
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // 게임 시작 버튼을 눌렀을 때 실행될 함수
        function startGame() {
            // 여기에 원래 만드셨던 게임 시작 코드를 넣으시면 됩니다.
            alert('게임을 시작합니다!');
        }
    </script>
</body>
</html>
